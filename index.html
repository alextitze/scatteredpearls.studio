<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scattered Pearls — coming soon</title>
  <meta name="description" content="A tiny studio for lean, ad-free, pay-once apps. No accounts, no tracking. First app coming soon.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f1e9">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17151b">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="studio-favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="studio-favicon-32.png">
  <link rel="apple-touch-icon" href="studio-favicon-180.png">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <style>
    /* Locally-hosted brand fonts — no CDN, no visitor data leaves for a third party. */
    @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/hanken-400.woff2") format("woff2"); }
    @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/hanken-600.woff2") format("woff2"); }
    @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/hanken-700.woff2") format("woff2"); }
    @font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/bricolage-600.woff2") format("woff2"); }
    @font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/bricolage-700.woff2") format("woff2"); }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(760px 420px at 50% -8%, rgba(213, 114, 155, .12), transparent 60%),
        var(--surface-0);
      color: var(--text);
      font-family: var(--font-body);
      font-size: var(--sp-text-md);
      line-height: var(--sp-leading-normal);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .page { flex: 1 0 auto; width: 100%; max-width: 680px; margin: 0 auto; padding: var(--sp-space-8) var(--sp-space-5); display: flex; flex-direction: column; justify-content: center; gap: var(--sp-space-6); }

    .hero { display: flex; align-items: center; gap: var(--sp-space-4); }
    .pearls { display: block; width: 88px; height: auto; flex: 0 0 auto; }

    .brand { display: flex; flex-direction: column; gap: var(--sp-space-3); }
    h1 { margin: 0; font-family: var(--font-display); font-weight: var(--sp-weight-bold); font-size: var(--sp-text-3xl); line-height: var(--sp-leading-tight); letter-spacing: var(--sp-tracking-tight); }
    .claim { font-family: var(--font-display); font-weight: var(--sp-weight-semibold); font-size: var(--sp-text-xl); color: var(--text-soft); }
    .lede { font-size: var(--sp-text-lg); color: var(--text-soft); max-width: 46ch; }

    .badges { display: flex; flex-wrap: wrap; gap: var(--sp-space-2); }
    /* Solid, always-valid badge look (fallback); the per-badge inline color-mix tints
       it and is simply ignored by any engine that can't resolve it. */
    .badge { font-size: var(--sp-text-sm); font-weight: var(--sp-weight-semibold); color: var(--text-soft); background: var(--surface-1); border: 1px solid var(--border-strong); border-radius: var(--sp-radius-pill); padding: var(--sp-space-2) var(--sp-space-4); }

    .app { display: flex; align-items: center; gap: var(--sp-space-4); background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-sheet); box-shadow: var(--sp-shadow-3); padding: var(--sp-space-5); }
    .app .icon { flex: 0 0 auto; width: 52px; height: 52px; border-radius: var(--radius-control); overflow: hidden; box-shadow: var(--pad-active-shadow); }
    .app .icon img { width: 100%; height: 100%; display: block; }
    .app .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .app .name { font-family: var(--font-display); font-weight: var(--sp-weight-semibold); font-size: var(--sp-text-lg); }
    .app .desc { color: var(--text-muted); font-size: var(--sp-text-sm); }
    .app .tag { margin-left: auto; flex: 0 0 auto; font-size: var(--sp-text-xs); font-weight: var(--sp-weight-bold); text-transform: uppercase; letter-spacing: var(--sp-tracking-label); color: var(--text-soft); background: var(--surface-2); background: color-mix(in srgb, var(--sp-pad-slate) 16%, var(--surface-1)); border: 1px solid var(--border-strong); border-color: color-mix(in srgb, var(--sp-pad-slate) 40%, var(--border-strong)); border-radius: var(--sp-radius-pill); padding: var(--sp-space-2) var(--sp-space-3); white-space: nowrap; }

    footer { flex-shrink: 0; text-align: center; color: var(--text-muted); font-size: var(--sp-text-sm); padding: var(--sp-space-5); border-top: 1px solid var(--border); }

    @media (max-width: 480px) {
      h1 { font-size: var(--sp-text-2xl); }
      .hero { flex-direction: column; align-items: flex-start; gap: var(--sp-space-3); }
      .pearls { width: 76px; }
      .app { flex-wrap: wrap; }
      .app .tag { margin-left: 0; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="brand">
      <div class="hero">
        <img class="pearls" src="studio-logo.svg" alt="" aria-hidden="true">
        <h1>Scattered Pearls</h1>
      </div>
      <div class="claim">Small, precious, scattered pearls.</div>
    </div>

    <p class="lede">A tiny studio for lean apps you buy once and simply use — no ads, no accounts, no tracking.</p>

    <div class="badges">
      <span class="badge" style="background: color-mix(in srgb, var(--sp-pad-amber) 16%, var(--surface-1)); border-color: color-mix(in srgb, var(--sp-pad-amber) 42%, var(--border-strong))">pay once</span>
      <span class="badge" style="background: color-mix(in srgb, var(--sp-pad-teal) 16%, var(--surface-1)); border-color: color-mix(in srgb, var(--sp-pad-teal) 42%, var(--border-strong))">ad-free</span>
      <span class="badge" style="background: color-mix(in srgb, var(--sp-pad-blue) 16%, var(--surface-1)); border-color: color-mix(in srgb, var(--sp-pad-blue) 42%, var(--border-strong))">no accounts</span>
      <span class="badge" style="background: color-mix(in srgb, var(--sp-pad-purple) 16%, var(--surface-1)); border-color: color-mix(in srgb, var(--sp-pad-purple) 42%, var(--border-strong))">no data collection</span>
    </div>

    <div class="app">
      <div class="icon">
        <img src="blitzfingers-icon.svg" alt="Blitzfingers app icon">
      </div>
      <div class="meta">
        <span class="name">Blitzfingers</span>
        <span class="desc">a soundboard — loops &amp; one-shots, finger-drumming</span>
      </div>
      <span class="tag">coming soon</span>
    </div>
  </main>

  <footer>© 2026 Scattered Pearls</footer>
</body>
</html>
