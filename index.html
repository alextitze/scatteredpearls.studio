<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scattered Pearls — coming soon</title>
  <meta name="description" content="A tiny studio for lean, ad-free, pay-once apps. No accounts, no tracking. First app coming soon.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f1e9">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17151b">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 118 100'%3E%3Ccircle cx='27' cy='52' r='13' fill='%23d0605a'/%3E%3Ccircle cx='48' cy='33' r='11' fill='%234ea99b'/%3E%3Ccircle cx='44' cy='72' r='8' fill='%23d9a441'/%3E%3Ccircle cx='70' cy='57' r='12' fill='%23d5729b'/%3E%3Ccircle cx='89' cy='42' r='9' fill='%23d0605a'/%3E%3Ccircle cx='98' cy='68' r='6' fill='%23cdb894'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <style>
    /* Locally-hosted brand fonts — no CDN, no visitor data leaves for a third party. */
    @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/hanken-400.woff2") format("woff2"); }
    @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/hanken-600.woff2") format("woff2"); }
    @font-face { font-family: "Hanken Grotesk"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/hanken-700.woff2") format("woff2"); }
    @font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/bricolage-600.woff2") format("woff2"); }
    @font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/bricolage-700.woff2") format("woff2"); }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(760px 420px at 50% -8%, rgba(213, 114, 155, .12), transparent 60%),
        var(--surface-0);
      color: var(--text);
      font-family: var(--font-body);
      font-size: var(--sp-text-md);
      line-height: var(--sp-leading-normal);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .page { flex: 1 0 auto; width: 100%; max-width: 680px; margin: 0 auto; padding: var(--sp-space-8) var(--sp-space-5); display: flex; flex-direction: column; justify-content: center; gap: var(--sp-space-6); }

    .pearls { display: block; width: 132px; height: auto; }

    .brand { display: flex; flex-direction: column; gap: var(--sp-space-3); }
    h1 { margin: 0; font-family: var(--font-display); font-weight: var(--sp-weight-bold); font-size: var(--sp-text-3xl); line-height: var(--sp-leading-tight); letter-spacing: var(--sp-tracking-tight); }
    .claim { font-family: var(--font-display); font-weight: var(--sp-weight-semibold); font-size: var(--sp-text-xl); color: var(--text-soft); }
    .lede { font-size: var(--sp-text-lg); color: var(--text-soft); max-width: 46ch; }

    .badges { display: flex; flex-wrap: wrap; gap: var(--sp-space-2); }
    .badge { font-size: var(--sp-text-sm); font-weight: var(--sp-weight-semibold); color: var(--text-soft); background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--sp-radius-pill); padding: var(--sp-space-2) var(--sp-space-4); }

    .app { display: flex; align-items: center; gap: var(--sp-space-4); background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-sheet); box-shadow: var(--sp-shadow-3); padding: var(--sp-space-5); }
    .app .icon { flex: 0 0 auto; width: 52px; height: 52px; border-radius: var(--radius-control); background: var(--pad-loop-active-bg); box-shadow: var(--pad-active-shadow); display: flex; align-items: center; justify-content: center; }
    .app .icon svg { width: 30px; height: 30px; }
    .app .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .app .name { font-family: var(--font-display); font-weight: var(--sp-weight-semibold); font-size: var(--sp-text-lg); }
    .app .desc { color: var(--text-muted); font-size: var(--sp-text-sm); }
    .app .tag { margin-left: auto; flex: 0 0 auto; font-size: var(--sp-text-xs); font-weight: var(--sp-weight-bold); text-transform: uppercase; letter-spacing: var(--sp-tracking-label); color: var(--accent); background: var(--accent-soft); border-radius: var(--sp-radius-pill); padding: var(--sp-space-2) var(--sp-space-3); white-space: nowrap; }

    footer { flex-shrink: 0; text-align: center; color: var(--text-muted); font-size: var(--sp-text-sm); padding: var(--sp-space-5); border-top: 1px solid var(--border); }

    @media (max-width: 480px) {
      h1 { font-size: var(--sp-text-2xl); }
      .app { flex-wrap: wrap; }
      .app .tag { margin-left: 0; }
    }
  </style>
</head>
<body>
  <main class="page">
    <svg class="pearls" viewBox="0 0 118 100" aria-hidden="true">
      <defs>
        <radialGradient id="wp-cor" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#fdeeeb"/><stop offset="45%" stop-color="#eaa198"/><stop offset="100%" stop-color="#d0605a"/></radialGradient>
        <radialGradient id="wp-tea" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#eefbf7"/><stop offset="45%" stop-color="#a2dad0"/><stop offset="100%" stop-color="#4ea99b"/></radialGradient>
        <radialGradient id="wp-amb" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#fff6e6"/><stop offset="45%" stop-color="#eccf8b"/><stop offset="100%" stop-color="#d9a441"/></radialGradient>
        <radialGradient id="wp-ros" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#fdedf3"/><stop offset="45%" stop-color="#edaac6"/><stop offset="100%" stop-color="#d5729b"/></radialGradient>
        <radialGradient id="wp-cre" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#fffdf7"/><stop offset="45%" stop-color="#ece0cd"/><stop offset="100%" stop-color="#cdb894"/></radialGradient>
      </defs>
      <circle cx="27" cy="52" r="13" fill="url(#wp-cor)"/>
      <circle cx="48" cy="33" r="11" fill="url(#wp-tea)"/>
      <circle cx="44" cy="72" r="8" fill="url(#wp-amb)"/>
      <circle cx="70" cy="57" r="12" fill="url(#wp-ros)"/>
      <circle cx="89" cy="42" r="9" fill="url(#wp-cor)"/>
      <circle cx="98" cy="68" r="6" fill="url(#wp-cre)"/>
    </svg>

    <div class="brand">
      <h1>Scattered Pearls</h1>
      <div class="claim">Small, precious, scattered pearls.</div>
    </div>

    <p class="lede">A tiny studio for lean apps you buy once and simply use — no ads, no accounts, no tracking.</p>

    <div class="badges">
      <span class="badge">ad-free</span>
      <span class="badge">pay once</span>
      <span class="badge">no accounts</span>
      <span class="badge">no data collection</span>
    </div>

    <div class="app">
      <div class="icon">
        <svg viewBox="0 0 150 150" aria-hidden="true"><g fill="#fff" opacity=".3"><rect x="28" y="28" width="28" height="28" rx="8"/><rect x="61" y="28" width="28" height="28" rx="8"/><rect x="94" y="28" width="28" height="28" rx="8"/><rect x="28" y="61" width="28" height="28" rx="8"/><rect x="61" y="61" width="28" height="28" rx="8"/><rect x="94" y="61" width="28" height="28" rx="8"/><rect x="28" y="94" width="28" height="28" rx="8"/><rect x="61" y="94" width="28" height="28" rx="8"/><rect x="94" y="94" width="28" height="28" rx="8"/></g><path d="M86 26 L52 82 H72 L64 124 L104 64 H80 Z" fill="#fff"/></svg>
      </div>
      <div class="meta">
        <span class="name">Blitzfingers</span>
        <span class="desc">a soundboard — loops &amp; one-shots, finger-drumming</span>
      </div>
      <span class="tag">coming soon</span>
    </div>
  </main>

  <footer>© 2026 Scattered Pearls</footer>
</body>
</html>
