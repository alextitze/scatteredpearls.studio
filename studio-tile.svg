    <symbol id="n" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="url(#b)"/><circle cx="50" cy="50" r="50" fill="url(#p)"/><circle cx="50" cy="50" r="50" fill="url(#t)"/></symbol>
