    <radialGradient id="a" cx="34%" cy="26%" r="78%"><stop offset="0%" stop-color="#fffaea"/><stop offset="24%" stop-color="#ffe09a"/><stop offset="68%" stop-color="#f2b13c"/><stop offset="100%" stop-color="#a8691a"/></radialGradient>
