<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" role="img" aria-label="Scattered Pearls" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c24a78"/>
      <stop offset="100%" stop-color="#6b2342"/>
    </linearGradient>
    <radialGradient id="body" cx="34%" cy="26%" r="78%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fdfbf6"/>
      <stop offset="52%" stop-color="#f1eade"/>
      <stop offset="80%" stop-color="#dcd0c0"/>
      <stop offset="100%" stop-color="#b3a28e"/>
    </radialGradient>
    <radialGradient id="pink" cx="62%" cy="74%" r="48%">
      <stop offset="0%" stop-color="#ffb3d0" stop-opacity=".50"/>
      <stop offset="100%" stop-color="#ffb3d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="76%" cy="28%" r="44%">
      <stop offset="0%" stop-color="#a6e8d4" stop-opacity=".46"/>
      <stop offset="100%" stop-color="#a6e8d4" stop-opacity="0"/>
    </radialGradient>
    <g id="pearl">
      <circle cx="50" cy="50" r="50" fill="url(#body)"/>
      <circle cx="50" cy="50" r="50" fill="url(#pink)"/>
      <circle cx="50" cy="50" r="50" fill="url(#teal)"/>
    </g>
  </defs>
  <rect x="0" y="0" width="150" height="150" rx="33" fill="url(#tile)"/>
  <use href="#pearl" transform="translate(27,31) scale(0.50)"/>
  <use href="#pearl" transform="translate(83,26) scale(0.34)"/>
  <use href="#pearl" transform="translate(59,82) scale(0.40)"/>
  <use href="#pearl" transform="translate(105,86) scale(0.22)"/>
</svg>
