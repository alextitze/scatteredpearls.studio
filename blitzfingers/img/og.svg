<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Blitzfingers — a finger-drumming soundboard for your pocket">
  <defs>
    <linearGradient id="og-diag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="50%" stop-color="#e0463a"/>
      <stop offset="50%" stop-color="#6d4fc0"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#6d4fc0" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#6d4fc0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#f6f1e9"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <!-- App-icon tile (left) -->
  <g transform="translate(96 175)">
    <rect width="280" height="280" rx="62" fill="url(#og-diag)"/>
    <g fill="#fff" opacity="0.28">
      <rect x="52" y="52" width="52" height="52" rx="15"/>
      <rect x="114" y="52" width="52" height="52" rx="15"/>
      <rect x="176" y="52" width="52" height="52" rx="15"/>
      <rect x="52" y="114" width="52" height="52" rx="15"/>
      <rect x="114" y="114" width="52" height="52" rx="15"/>
      <rect x="176" y="114" width="52" height="52" rx="15"/>
      <rect x="52" y="176" width="52" height="52" rx="15"/>
      <rect x="114" y="176" width="52" height="52" rx="15"/>
      <rect x="176" y="176" width="52" height="52" rx="15"/>
    </g>
    <path d="M160 48 L96 152 H134 L119 230 L194 118 H149 Z" fill="#ffd23f"/>
  </g>

  <!-- Wordmark + tagline (right) -->
  <g transform="translate(448 0)" fill="#2a2420" font-family="'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif">
    <text x="0" y="272" font-size="112" font-weight="700" letter-spacing="-2">Blitzfingers</text>
    <text x="2" y="336" font-size="32" font-weight="600" fill="#4a4139" font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif">A finger-drumming soundboard for your pocket.</text>

    <!-- Principle chips -->
    <g font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="600" fill="#4a4139">
      <g transform="translate(0 396)">
        <rect width="220" height="52" rx="26" fill="#fffdf9" stroke="#6d4fc0" stroke-opacity="0.4"/>
        <text x="110" y="34" text-anchor="middle">yours to keep</text>
      </g>
      <g transform="translate(236 396)">
        <rect width="138" height="52" rx="26" fill="#fffdf9" stroke="#1f8477" stroke-opacity="0.4"/>
        <text x="69" y="34" text-anchor="middle">no ads</text>
      </g>
      <g transform="translate(390 396)">
        <rect width="193" height="52" rx="26" fill="#fffdf9" stroke="#3a5bc7" stroke-opacity="0.4"/>
        <text x="96" y="34" text-anchor="middle">no tracking</text>
      </g>
    </g>
  </g>

  <!-- Studio mark (bottom) -->
  <text x="448" y="560" fill="#736a5e" font-size="28" font-weight="600"
        font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif">A Scattered Pearls app · scatteredpearls.studio</text>
</svg>
