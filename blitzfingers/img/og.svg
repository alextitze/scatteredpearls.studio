<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Blitzfingers — a finger-drumming soundboard for your pocket">
  <defs>
    <linearGradient id="og-diag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="50%" stop-color="#e0463a"/>
      <stop offset="50%" stop-color="#6d4fc0"/>
    </linearGradient>
    <!-- The two glows the page's own hero uses: violet from above, red from below. -->
    <radialGradient id="og-glow-top">
      <stop offset="0%" stop-color="#6d4fc0" stop-opacity="0.22"/>
      <stop offset="62%" stop-color="#6d4fc0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-glow-bot">
      <stop offset="0%" stop-color="#e0463a" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#e0463a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background: the page's dark ground, not the old cream one -->
  <rect width="1200" height="630" fill="#17151b"/>
  <ellipse cx="600" cy="-76" rx="940" ry="560" fill="url(#og-glow-top)"/>
  <ellipse cx="600" cy="706" rx="800" ry="420" fill="url(#og-glow-bot)"/>

  <!-- App-icon tile (left) -->
  <g transform="translate(96 175)">
    <rect width="280" height="280" rx="62" fill="url(#og-diag)"/>
    <g fill="#fff" opacity="0.28">
      <rect x="52" y="52" width="52" height="52" rx="15"/>
      <rect x="114" y="52" width="52" height="52" rx="15"/>
      <rect x="176" y="52" width="52" height="52" rx="15"/>
      <rect x="52" y="114" width="52" height="52" rx="15"/>
      <rect x="114" y="114" width="52" height="52" rx="15"/>
      <rect x="176" y="114" width="52" height="52" rx="15"/>
      <rect x="52" y="176" width="52" height="52" rx="15"/>
      <rect x="114" y="176" width="52" height="52" rx="15"/>
      <rect x="176" y="176" width="52" height="52" rx="15"/>
    </g>
    <path d="M160 48 L96 152 H134 L119 230 L194 118 H149 Z" fill="#ffd23f"/>
  </g>

  <!-- Wordmark + tagline (right) -->
  <g transform="translate(448 0)">
    <text x="0" y="272" font-size="112" font-weight="700" letter-spacing="-3" fill="#f1ede6"
          font-family="'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif">Blitzfingers</text>
    <text x="2" y="336" font-size="32" font-weight="600" fill="#cfc7bb"
          font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif">A finger-drumming soundboard for your pocket.</text>

    <!-- Promises: the same uppercase label strip the page uses, dots and all -->
    <g transform="translate(2 420)" font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif"
       font-size="26" font-weight="700" letter-spacing="2.6" fill="#cfc7bb">
      <text x="0" y="0">YOURS TO KEEP</text>
      <circle cx="243" cy="-9" r="2" fill="#ffffff" fill-opacity="0.4"/>
      <text x="260" y="0">NO ADS</text>
      <circle cx="387" cy="-9" r="2" fill="#ffffff" fill-opacity="0.4"/>
      <text x="404" y="0">NO TRACKING</text>
    </g>
  </g>

  <!-- Studio mark (bottom) -->
  <text x="448" y="560" fill="#a49a8d" font-size="28" font-weight="600"
        font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif">A Scattered Pearls app · scatteredpearls.studio</text>
</svg>
