<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" role="img" aria-label="Blitzfingers">
  <!-- App-icon master: full-bleed, opaque, SQUARE (no rounded corners, no alpha) — iOS/App Store
       apply the rounding mask themselves. Diagonal two-tone red → purple + yellow bolt. Rasterise
       to 1024×1024 as the @capacitor/assets source. -->
  <defs>
    <linearGradient id="bfsq-diag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="50%" stop-color="#e0463a"/>
      <stop offset="50%" stop-color="#6d4fc0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="150" height="150" fill="url(#bfsq-diag)"/>
  <g fill="#fff" opacity=".28">
    <rect x="28" y="28" width="28" height="28" rx="8"/>
    <rect x="61" y="28" width="28" height="28" rx="8"/>
    <rect x="94" y="28" width="28" height="28" rx="8"/>
    <rect x="28" y="61" width="28" height="28" rx="8"/>
    <rect x="61" y="61" width="28" height="28" rx="8"/>
    <rect x="94" y="61" width="28" height="28" rx="8"/>
    <rect x="28" y="94" width="28" height="28" rx="8"/>
    <rect x="61" y="94" width="28" height="28" rx="8"/>
    <rect x="94" y="94" width="28" height="28" rx="8"/>
  </g>
  <path d="M86 26 L52 82 H72 L64 124 L104 64 H80 Z" fill="#ffd23f"/>
</svg>
