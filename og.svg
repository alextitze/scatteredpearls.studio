<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Scattered Pearls — small, precious, scattered pearls">
  <!-- The studio's link preview (og:image). Same layout as blitzfingers/img/og.svg: the mark left, the words right.
       Rasterise to og.png at 1200×630 in a browser (the page's fonts load from fonts/). -->
  <style>
    @font-face { font-family: "Bricolage Grotesque"; font-weight: 700; src: url("fonts/bricolage-700.woff2") format("woff2"); }
    @font-face { font-family: "Hanken Grotesk"; font-weight: 600; src: url("fonts/hanken-600.woff2") format("woff2"); }
    @font-face { font-family: "Hanken Grotesk"; font-weight: 700; src: url("fonts/hanken-700.woff2") format("woff2"); }
  </style>
  <defs>
    <!-- The page's two glows on the ink ground: violet from the upper right, warm from the lower left. -->
    <radialGradient id="og-glow-top"><stop offset="0%" stop-color="#34224a" stop-opacity="1"/><stop offset="62%" stop-color="#34224a" stop-opacity="0"/></radialGradient>
    <radialGradient id="og-glow-bot"><stop offset="0%" stop-color="#3b2228" stop-opacity="1"/><stop offset="60%" stop-color="#3b2228" stop-opacity="0"/></radialGradient>
    <linearGradient id="og-tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2a1d31"/><stop offset="100%" stop-color="#150f19"/></linearGradient>
    <radialGradient id="og-b" cx="34%" cy="26%" r="78%"><stop offset="0%" stop-color="#ffffff"/><stop offset="20%" stop-color="#fdfbf6"/><stop offset="52%" stop-color="#f1eade"/><stop offset="80%" stop-color="#dcd0c0"/><stop offset="100%" stop-color="#b3a28e"/></radialGradient>
    <radialGradient id="og-p" cx="62%" cy="74%" r="48%"><stop offset="0%" stop-color="#ffb3d0" stop-opacity=".5"/><stop offset="100%" stop-color="#ffb3d0" stop-opacity="0"/></radialGradient>
    <radialGradient id="og-t" cx="76%" cy="28%" r="44%"><stop offset="0%" stop-color="#a6e8d4" stop-opacity=".46"/><stop offset="100%" stop-color="#a6e8d4" stop-opacity="0"/></radialGradient>
    <radialGradient id="og-c" cx="34%" cy="26%" r="78%"><stop offset="0%" stop-color="#fff1ec"/><stop offset="24%" stop-color="#ffb4a1"/><stop offset="68%" stop-color="#ec6a4f"/><stop offset="100%" stop-color="#a8321f"/></radialGradient>
    <radialGradient id="og-a" cx="34%" cy="26%" r="78%"><stop offset="0%" stop-color="#fffaea"/><stop offset="24%" stop-color="#ffe09a"/><stop offset="68%" stop-color="#f2b13c"/><stop offset="100%" stop-color="#a8691a"/></radialGradient>
    <radialGradient id="og-q" cx="34%" cy="26%" r="78%"><stop offset="0%" stop-color="#f0fffb"/><stop offset="24%" stop-color="#a9ebdc"/><stop offset="68%" stop-color="#3fb7a2"/><stop offset="100%" stop-color="#16695e"/></radialGradient>
    <symbol id="og-n" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="url(#og-b)"/><circle cx="50" cy="50" r="50" fill="url(#og-p)"/><circle cx="50" cy="50" r="50" fill="url(#og-t)"/></symbol>
  </defs>

  <rect width="1200" height="630" fill="#150f19"/>
  <ellipse cx="1060" cy="40" rx="760" ry="520" fill="url(#og-glow-top)"/>
  <ellipse cx="120" cy="640" rx="720" ry="420" fill="url(#og-glow-bot)"/>

  <!-- The studio mark — the strand (design-system/brand/assets/studio-tile.svg), 280 px -->
  <g transform="translate(96 175) scale(1.8667)">
    <rect width="150" height="150" rx="33" fill="url(#og-tile)" stroke="#f6eee4" stroke-opacity=".08" stroke-width="1"/>
    <path d="M14 46 Q50 84 88 78" fill="none" stroke="#d8b67a" stroke-width="3" stroke-linecap="round"/>
    <use href="#og-n" x="15.5" y="46.4" width="26" height="26"/>
    <use href="#og-n" x="37" y="59.5" width="27" height="27"/>
    <use href="#og-n" x="59.9" y="65.6" width="26" height="26"/>
    <circle cx="108" cy="98" r="11" fill="url(#og-c)"/>
    <circle cx="118" cy="60" r="8" fill="url(#og-q)"/>
    <circle cx="128" cy="118" r="6" fill="url(#og-a)"/>
  </g>

  <!-- Words (right) -->
  <g transform="translate(448 0)">
    <text x="2" y="186" font-size="22" font-weight="700" letter-spacing="4" fill="#e8c48a"
          font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif">A ONE-MAN STUDIO</text>
    <text x="0" y="290" font-size="112" font-weight="700" letter-spacing="-3" fill="#fdf6ee"
          font-family="'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif">Scattered</text>
    <text x="0" y="394" font-size="112" font-weight="700" letter-spacing="-3" fill="#fdf6ee"
          font-family="'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif">Pearls</text>
    <text x="2" y="456" font-size="32" font-weight="600" fill="#d9cfc4"
          font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif">Small, precious, scattered pearls.</text>
    <text x="2" y="552" font-size="24" font-weight="600" fill="#a99a93"
          font-family="'Hanken Grotesk','Helvetica Neue',Arial,sans-serif">Apps that are yours to keep · scatteredpearls.studio</text>
  </g>
</svg>
